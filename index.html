<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoatMinecraft服务器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            width: 100vw;
            height: 100vh;
            background-color: #e0f7fa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .main-title {
            font-size: 28px;
            font-weight: bold;
            color: #004d40;
            margin-bottom: 60px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
        }
        .server-info {
            font-size: 20px;
            color: #00695c;
            line-height: 1.8;
            margin-bottom: 50px;
        }
        .server-link {
            font-weight: 600;
            color: #00796b;
            letter-spacing: 1px;
        }
        .enter-btn {
            padding: 14px 40px;
            font-size: 18px;
            background-color: #0d47a1;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
        }
        .enter-btn:hover {
            background-color: #0a3d8a;
        }
    </style>
</head>
<body>
    <h1 class="main-title">BoatMinecraft的Java版1.21.1Fabric服务器</h1>
    <div class="server-info">
        <p>服务器链接</p>
        <p class="server-link">boatminecraftserver.dpdns.org</p>
    </div>
    <a href="/Download">
        <button class="enter-btn">下载进入服务器资源</button>
    </a>
</body>
</html>
